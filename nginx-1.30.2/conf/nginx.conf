# Nginx configuration for the Nx Angular Module Federation workspace.
#
# Build first:
#   cd d:/ng20
#   npm exec nx run-many -t build -p shell,customer,billing,reports --configuration=production
#
# Then copy or mount the build folders so the paths below exist:
#   /usr/share/nginx/html/shell
#   /usr/share/nginx/html/customer
#   /usr/share/nginx/html/billing
#   /usr/share/nginx/html/reports
#
# Ports:
#   Shell    -> http://localhost:4200
#   Customer -> http://localhost:4201
#   Billing  -> http://localhost:4202
#   Reports  -> http://localhost:4203

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

  map $sent_http_content_type $cache_control {
    default "no-cache";
    ~*text/html "no-store, no-cache, must-revalidate, proxy-revalidate";
    ~*application/javascript "public, max-age=31536000, immutable";
    ~*text/css "public, max-age=31536000, immutable";
    ~*image/ "public, max-age=31536000, immutable";
    ~*font/ "public, max-age=31536000, immutable";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, Pragma" always;
  add_header Access-Control-Max-Age 86400 always;
  add_header Cache-Control $cache_control always;

  # Shell application
  server {
    listen 4200;
    server_name localhost;
    root D:/ng20/dist/apps/shell;
    index index.html;

    location / {
      try_files $uri /index.html;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      try_files $uri =404;
    }
  }

  # Customer remote application
  server {
    listen 4201;
    server_name localhost;
    root D:/ng20/dist/apps/customer;
    index index.html;

    location / {
      try_files $uri /index.html;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      try_files $uri =404;
    }
  }

  # Billing remote application
  server {
    listen 4202;
    server_name localhost;
    root D:/ng20/dist/apps/billing;
    index index.html;

    location / {
      try_files $uri /index.html;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      try_files $uri =404;
    }
  }

  # Reports remote application
  server {
    listen 4203;
    server_name localhost;
    root D:/ng20/dist/apps/reports;
    index index.html;

    location / {
      try_files $uri /index.html;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      try_files $uri =404;
    }
  }
}