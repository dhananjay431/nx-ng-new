<div
  class="login-container d-flex align-items-center justify-content-center min-vh-100"
>
  <div
    class="card shadow-lg rounded-4 p-4"
    style="max-width: 420px; width: 100%"
  >
    <div class="card-body text-center">
      <div class="mb-4">
        <i class="bi bi-building fs-1 text-primary"></i>
        <h3 class="mt-2 fw-bold">Enterprise Portal</h3>
        <p class="text-muted small">Sign in to your account</p>
      </div>

      @if (error) {
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        {{ error }}
        <button type="button" class="btn-close" (click)="error = ''"></button>
      </div>
      }

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="mb-3 text-start">
          <label for="email" class="form-label small fw-semibold"
            >Email Address</label
          >
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="you@company.com"
              [(ngModel)]="email"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="mb-3 text-start">
          <label for="password" class="form-label small fw-semibold"
            >Password</label
          >
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="••••••••"
              [(ngModel)]="password"
              required
              autocomplete="current-password"
            />
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="rememberMe"
              [(ngModel)]="rememberMe"
              name="rememberMe"
            />
            <label class="form-check-label small" for="rememberMe"
              >Remember me</label
            >
          </div>
          <a href="#" class="text-decoration-none small">Forgot password?</a>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 py-2 fw-semibold"
          [disabled]="loading || !email || !password"
        >
          @if (loading) {
          <span
            class="spinner-border spinner-border-sm me-2"
            role="status"
          ></span>
          } @else {
          <i class="bi bi-box-arrow-in-right me-2"></i>
          } {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
    </div>
  </div>
</div>
