<aside
  class="sidebar d-flex flex-column"
  [class.collapsed]="!isOpen()"
  [class.mobile-open]="isOpen()"
>
  <!-- Sidebar Header -->
  <div
    class="sidebar-header d-flex align-items-center justify-content-between px-3 py-3"
  >
    <span class="sidebar-brand small fw-bold text-uppercase text-muted"
      >Navigation</span
    >
    <button
      class="btn-close d-md-none"
      (click)="closeSidebar()"
      aria-label="Close sidebar"
    ></button>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav flex-grow-1">
    <ul class="nav flex-column">
      @for (item of filteredMenuItems; track item.moduleKey) {
      <li class="nav-item">
        <a
          [routerLink]="item.route"
          class="nav-link d-flex align-items-center"
          [class.active]="isActive(item.route)"
          (click)="closeSidebar()"
        >
          <i [class]="item.icon + ' me-3 fs-5'"></i>
          <span>{{ item.label }}</span>
        </a>
      </li>
      }
    </ul>
  </nav>

  <!-- Sidebar Footer / Logout -->
  <div class="sidebar-footer mt-auto border-top">
    <a
      routerLink="/login"
      class="nav-link d-flex align-items-center px-3 py-3 text-danger"
      (click)="logout()"
    >
      <i class="bi bi-box-arrow-right me-3 fs-5"></i>
      <span>Logout</span>
    </a>
  </div>
</aside>

<!-- Mobile backdrop overlay -->
<div
  class="sidebar-backdrop d-md-none"
  [class.show]="isOpen()"
  (click)="closeSidebar()"
></div>
