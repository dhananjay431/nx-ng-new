<nav class="navbar navbar-expand top-navbar shadow-sm sticky-top">
  <div class="container-fluid">
    <!-- Sidebar Toggle + Logo -->
    <div class="d-flex align-items-center">
      <button
        class="btn btn-link text-body sidebar-toggle me-2"
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar"
      >
        <i class="bi bi-list fs-5"></i>
      </button>
      <a
        routerLink="/dashboard"
        class="navbar-brand d-flex align-items-center text-decoration-none"
      >
        <i class="bi bi-grid-1x2-fill text-primary me-2 fs-5"></i>
        <span class="fw-bold d-none d-md-inline">Enterprise Portal</span>
      </a>
    </div>

    <!-- Right side actions -->
    <div class="d-flex align-items-center ms-auto gap-2">
      <!-- Theme Toggle -->
      <button
        class="btn btn-link text-body theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="themeLabel"
        title="{{ themeLabel }}"
      >
        <i [class]="themeIcon"></i>
      </button>

      <!-- Profile Dropdown -->
      <div class="dropdown">
        <button
          class="btn btn-link text-body dropdown-toggle d-flex align-items-center text-decoration-none"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <i class="bi bi-person-circle fs-5 me-1"></i>
          <span class="d-none d-md-inline small fw-semibold"
            >{{ username }}</span
          >
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow">
          <li>
            <a class="dropdown-item" routerLink="/profile"
              ><i class="bi bi-person me-2"></i>Profile</a
            >
          </li>
          <li>
            <a class="dropdown-item" routerLink="/settings"
              ><i class="bi bi-gear me-2"></i>Settings</a
            >
          </li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <a class="dropdown-item" routerLink="/login" (click)="logout()"
              ><i class="bi bi-box-arrow-right me-2"></i>Logout</a
            >
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
